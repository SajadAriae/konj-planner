name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Konj Planner APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------
      # 3. Flutter Stable
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ----------------------------------------
      # 4. Versions
      # ----------------------------------------
      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      # ----------------------------------------
      # 5. Create Android project
      # ----------------------------------------
      - name: Create Android platform
        run: |
          flutter create \
            --project-name planner \
            --org com.konj \
            --platforms android \
            .

      # ----------------------------------------
      # 6. Configure Android
      # ----------------------------------------
      - name: Configure Android
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android Gradle"
          echo "========================================"

          # --------------------------------------
          # Disable AGP 9 new DSL temporarily
          # --------------------------------------

          GRADLE_PROPERTIES="android/gradle.properties"

          if [ -f "$GRADLE_PROPERTIES" ]; then
            echo "android.newDsl=false" >> "$GRADLE_PROPERTIES"
          else
            mkdir -p android
            echo "android.newDsl=false" > "$GRADLE_PROPERTIES"
          fi

          echo ""
          echo "gradle.properties:"
          cat "$GRADLE_PROPERTIES"

          # --------------------------------------
          # Configure app/build.gradle.kts
          # --------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts does not exist"
              )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------
          # Remove any previous broken additions
          # --------------------------------------

          text = text.replace(
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
              ""
          )

          # --------------------------------------
          # Add compileOptions inside android block
          # --------------------------------------

          if "isCoreLibraryDesugaringEnabled = true" not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android { block not found"
                  )

              compile_options = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              """

              text = text.replace(
                  marker,
                  marker + compile_options,
                  1
              )

          # --------------------------------------
          # Add dependency
          # --------------------------------------

          dependency_block = """
          
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """

          if "desugar_jdk_libs" not in text:
              text += dependency_block

          path.write_text(text, encoding="utf-8")

          # --------------------------------------
          # Verify
          # --------------------------------------

          print("========================================")
          print("FINAL build.gradle.kts")
          print("========================================")
          print(text)
          print("========================================")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              raise SystemExit(
                  "ERROR: Desugaring was not enabled!"
              )

          if "desugar_jdk_libs:2.1.4" not in text:
              raise SystemExit(
                  "ERROR: desugar_jdk_libs dependency missing!"
              )

          print("ANDROID GRADLE CONFIGURATION OK")
          PY

      # ----------------------------------------
      # 7. Flutter dependencies
      # ----------------------------------------
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ----------------------------------------
      # 8. Build APK
      # ----------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release

      # ----------------------------------------
      # 9. Prepare APK
      # ----------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Konj-Planner.apk

          ls -lh release/Konj-Planner.apk

      # ----------------------------------------
      # 10. Upload APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Konj-Planner-APK
          path: release/Konj-Planner.apk
          if-no-files-found: error
