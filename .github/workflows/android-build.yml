name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Konj Planner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create Android platform
        run: |
          flutter create \
            --project-name planner \
            --org com.konj \
            --platforms android \
            .

      - name: Install Konj Android widget files
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/konj/planner
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cp widget_android/kotlin/com/konj/planner/KonjPlannerWidgetProvider.kt \
            android/app/src/main/kotlin/com/konj/planner/

          cp widget_android/res/layout/konj_planner_widget.xml \
            android/app/src/main/res/layout/

          cp widget_android/res/xml/konj_planner_widget_info.xml \
            android/app/src/main/res/xml/

          cp widget_android/res/drawable/konj_widget_bg.xml \
            android/app/src/main/res/drawable/

          # Use the repository logo as the launcher icon when available.
          if [ -f logo.png ]; then
            cp logo.png android/app/src/main/res/drawable/konj_logo.png
          fi

      - name: Install notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/konj_notify.wav android/app/src/main/res/raw/konj_notify.wav

      - name: Add notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_notif.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          XML

      - name: Configure Android manifest and Gradle
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # --------------------------------------------
          # Android Gradle compatibility for AGP 9
          # --------------------------------------------
          gp = Path("android/gradle.properties")
          text = gp.read_text(encoding="utf-8") if gp.exists() else ""
          if "android.newDsl=false" not in text:
              text += "\nandroid.newDsl=false\n"
          gp.write_text(text, encoding="utf-8")

          # --------------------------------------------
          # Desugaring required by flutter_local_notifications
          # --------------------------------------------
          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "android {"
              block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              """
              if marker not in text:
                  raise SystemExit("android block not found")
              text = text.replace(marker, marker + block, 1)

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if "desugar_jdk_libs" not in text:
              text += "\n\ndependencies {\n    " + dep + "\n}\n"

          path.write_text(text, encoding="utf-8")

          # --------------------------------------------
          # Manifest: app name + real Android widget
          # --------------------------------------------
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          m = m.replace('android:label="planner"', 'android:label="Konj Planner"')

          if 'android:icon="@mipmap/ic_launcher"' in m and False:
              m = m.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/konj_logo"', 1)

          receiver = (
              "\n        <receiver"
              "\n            android:name=\".KonjPlannerWidgetProvider\""
              "\n            android:exported=\"true\">"
              "\n            <intent-filter>"
              "\n                <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />"
              "\n            </intent-filter>"
              "\n            <meta-data"
              "\n                android:name=\"android.appwidget.provider\""
              "\n                android:resource=\"@xml/konj_planner_widget_info\" />"
              "\n        </receiver>"
          )

          if "KonjPlannerWidgetProvider" not in m:
              m = m.replace("    </application>", receiver + "\n    </application>", 1)

          import re
          perm = ''.join('\n    <uses-permission android:name="android.permission.%s"/>' % p for p in ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'WAKE_LOCK', 'VIBRATE'])
          if 'USE_EXACT_ALARM' not in m:
              m = re.sub(r'(<manifest[^>]*>)', lambda x: x.group(1) + perm, m, count=1)
          nrecv = ('\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />'
                   '\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
                   '\n            <intent-filter>'
                   '\n                <action android:name="android.intent.action.BOOT_COMPLETED" />'
                   '\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />'
                   '\n            </intent-filter>'
                   '\n        </receiver>')
          if 'ScheduledNotificationReceiver' not in m:
              m = m.replace('    </application>', nrecv + '\n    </application>', 1)
          hw = ('\n        <receiver android:name="es.antonborri.home_widget.HomeWidgetBackgroundReceiver" android:exported="true">'
                '\n            <intent-filter>'
                '\n                <action android:name="es.antonborri.home_widget.action.BACKGROUND" />'
                '\n            </intent-filter>'
                '\n        </receiver>'
                '\n        <service android:name="es.antonborri.home_widget.HomeWidgetBackgroundService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="true" />')
          if 'HomeWidgetBackgroundReceiver' not in m:
              m = m.replace('    </application>', hw + '\n    </application>', 1)
          manifest.write_text(m, encoding="utf-8")

          print("ANDROID CONFIGURATION READY")
          print(path.read_text(encoding="utf-8"))
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Release signing secrets are not configured in GitHub."
            echo "Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/konj-release.jks

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if 'create("konjRelease")' not in s:
              marker = "    buildTypes {"
              lines = [
                  "    signingConfigs {",
                  "        create(\"konjRelease\") {",
                  "            storeFile = file(\"../konj-release.jks\")",
                  "            storePassword = System.getenv(\"KEYSTORE_PASSWORD\")",
                  "            keyAlias = System.getenv(\"KEY_ALIAS\")",
                  "            keyPassword = System.getenv(\"KEY_PASSWORD\")",
                  "        }",
                  "    }",
                  "",
              ]
              signing = "\n".join(lines) + "\n"
              if marker not in s:
                  raise SystemExit("buildTypes block not found")
              s = s.replace(marker, signing + marker, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("konjRelease")\n            isMinifyEnabled = false\n            isShrinkResources = false',
              1,
          )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Release signing configured."

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Konj-Planner.apk
          ls -lh release/Konj-Planner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Konj-Planner-APK
          path: release/Konj-Planner.apk
          if-no-files-found: error
