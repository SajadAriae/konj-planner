name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Konj Planner APK
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Download repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------
      # 3. Flutter
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ----------------------------------------
      # 4. Show versions
      # ----------------------------------------
      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version
          java -version

      # ----------------------------------------
      # 5. Create Android platform
      # ----------------------------------------
      - name: Create Android platform
        run: |
          flutter create \
            --project-name planner \
            --org com.konj \
            --platforms android \
            .

      # ----------------------------------------
      # 6. Configure Android Gradle
      # ----------------------------------------
      - name: Configure Android Gradle
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise Exception("android/app/build.gradle.kts was not found!")

          text = path.read_text(encoding="utf-8")

          # ----------------------------------------
          # Enable Java 17 + Core Library Desugaring
          # ----------------------------------------

          if "isCoreLibraryDesugaringEnabled = true" not in text:

              compile_block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              """

              marker = "\n}\n\nflutter {"

              if marker in text:
                  text = text.replace(
                      marker,
                      compile_block + marker,
                      1
                  )
              else:
                  raise Exception(
                      "Could not find android block in build.gradle.kts"
                  )

          # ----------------------------------------
          # Add desugaring dependency
          # ----------------------------------------

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4"'
              ')'
          )

          if "desugar_jdk_libs" not in text:

              text += (
                  "\n\n"
                  "dependencies {\n"
                  "    " + dependency + "\n"
                  "}\n"
              )

          path.write_text(text, encoding="utf-8")

          # ----------------------------------------
          # Verify configuration
          # ----------------------------------------

          print("========================================")
          print("FINAL ANDROID GRADLE CONFIG")
          print("========================================")
          print(text)
          print("========================================")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              raise Exception(
                  "ERROR: Core Library Desugaring was NOT enabled!"
              )

          if "desugar_jdk_libs" not in text:
              raise Exception(
                  "ERROR: desugar_jdk_libs dependency was NOT added!"
              )

          print("DESUGARING CONFIGURATION OK")
          print("========================================")
          PY

      # ----------------------------------------
      # 7. Get Flutter packages
      # ----------------------------------------
      - name: Flutter Pub Get
        run: |
          flutter pub get

  

      # ----------------------------------------
      # 9. Build release APK
      # ----------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release

      # ----------------------------------------
      # 10. Rename APK
      # ----------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Konj-Planner.apk

      # ----------------------------------------
      # 11. Upload APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Konj-Planner-APK
          path: release/Konj-Planner.apk
          if-no-files-found: error
