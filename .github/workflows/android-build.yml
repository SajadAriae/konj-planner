name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Konj Planner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create Android platform
        run: |
          flutter create \
            --project-name planner \
            --org com.konj \
            --platforms android \
            .

      - name: Install Konj Android widget files
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/konj/planner
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cp widget_android/kotlin/com/konj/planner/KonjPlannerWidgetProvider.kt \
            android/app/src/main/kotlin/com/konj/planner/

          cp widget_android/res/layout/konj_planner_widget.xml \
            android/app/src/main/res/layout/

          cp widget_android/res/xml/konj_planner_widget_info.xml \
            android/app/src/main/res/xml/

          cp widget_android/res/drawable/konj_widget_bg.xml \
            android/app/src/main/res/drawable/

          # Use the repository logo as the launcher icon when available.
          if [ -f logo.png ]; then
            cp logo.png android/app/src/main/res/drawable/konj_logo.png
          fi

      - name: Configure Android manifest and Gradle
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # --------------------------------------------
          # Android Gradle compatibility for AGP 9
          # --------------------------------------------
          gp = Path("android/gradle.properties")
          text = gp.read_text(encoding="utf-8") if gp.exists() else ""
          if "android.newDsl=false" not in text:
              text += "\nandroid.newDsl=false\n"
          gp.write_text(text, encoding="utf-8")

          # --------------------------------------------
          # Desugaring required by flutter_local_notifications
          # --------------------------------------------
          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "android {"
              block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              """
              if marker not in text:
                  raise SystemExit("android block not found")
              text = text.replace(marker, marker + block, 1)

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if "desugar_jdk_libs" not in text:
              text += "\n\ndependencies {\n    " + dep + "\n}\n"

          path.write_text(text, encoding="utf-8")

          # --------------------------------------------
          # Manifest: app name + real Android widget
          # --------------------------------------------
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          m = m.replace('android:label="planner"', 'android:label="Konj Planner"')

          if 'android:icon="@mipmap/ic_launcher"' in m and Path("android/app/src/main/res/drawable/konj_logo.png").exists():
              m = m.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/konj_logo"', 1)

          receiver = (
              "\n        <receiver"
              "\n            android:name=\".KonjPlannerWidgetProvider\""
              "\n            android:exported=\"true\">"
              "\n            <intent-filter>"
              "\n                <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />"
              "\n            </intent-filter>"
              "\n            <meta-data"
              "\n                android:name=\"android.appwidget.provider\""
              "\n                android:resource=\"@xml/konj_planner_widget_info\" />"
              "\n        </receiver>"
          )

          if "KonjPlannerWidgetProvider" not in m:
              m = m.replace("    </application>", receiver + "\n    </application>", 1)

          manifest.write_text(m, encoding="utf-8")

          print("ANDROID CONFIGURATION READY")
          print(path.read_text(encoding="utf-8"))
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Release signing secrets are not configured in GitHub."
            echo "Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/konj-release.jks

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if 'create("konjRelease")' not in s:
              marker = "    buildTypes {"
              lines = [
                  "    signingConfigs {",
                  "        create(\"konjRelease\") {",
                  "            storeFile = file(\"../konj-release.jks\")",
                  "            storePassword = System.getenv(\"KEYSTORE_PASSWORD\")",
                  "            keyAlias = System.getenv(\"KEY_ALIAS\")",
                  "            keyPassword = System.getenv(\"KEY_PASSWORD\")",
                  "        }",
                  "    }",
                  "",
              ]
              signing = "\n".join(lines) + "\n"
              if marker not in s:
                  raise SystemExit("buildTypes block not found")
              s = s.replace(marker, signing + marker, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("konjRelease")',
              1,
          )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Release signing configured."

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Konj-Planner.apk
          ls -lh release/Konj-Planner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Konj-Planner-APK
          path: release/Konj-Planner.apk
          if-no-files-found: error
