name: Konj Planner Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Konj Planner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --project-name planner \
            --org com.konj \
            --platforms android \
            .

      - name: Configure Android
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # ------------------------------------------------
          # 1. Enable Core Library Desugaring
          # ------------------------------------------------

          if "isCoreLibraryDesugaringEnabled" in text:
              text = re.sub(
                  r"isCoreLibraryDesugaringEnabled\s*=\s*(true|false)",
                  "isCoreLibraryDesugaringEnabled = true",
                  text
              )
          else:
              compile_options = re.search(
                  r"compileOptions\s*\{",
                  text
              )

              if compile_options:
                  pos = compile_options.end()
                  text = (
                      text[:pos]
                      + "\n        isCoreLibraryDesugaringEnabled = true"
                      + text[pos:]
                  )
              else:
                  android_block = re.search(
                      r"android\s*\{",
                      text
                  )

                  if not android_block:
                      raise Exception(
                          "Could not find android { block"
                      )

                  pos = android_block.end()

                  block = """
                  
                      compileOptions {
                          isCoreLibraryDesugaringEnabled = true
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  """

                  text = text[:pos] + block + text[pos:]

          # ------------------------------------------------
          # 2. Java 17
          # ------------------------------------------------

          text = re.sub(
              r"sourceCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+",
              "sourceCompatibility = JavaVersion.VERSION_17",
              text
          )

          text = re.sub(
              r"targetCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+",
              "targetCompatibility = JavaVersion.VERSION_17",
              text
          )

          # ------------------------------------------------
          # 3. Add desugar_jdk_libs
          # ------------------------------------------------

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4"'
              ')'
          )

          if "desugar_jdk_libs" not in text:

              dependencies_match = re.search(
                  r"dependencies\s*\{",
                  text
              )

              if dependencies_match:
                  pos = dependencies_match.end()

                  text = (
                      text[:pos]
                      + "\n    "
                      + dependency
                      + text[pos:]
                  )

              else:
                  text += f"""

dependencies {{
    {dependency}
}}
"""

          path.write_text(text, encoding="utf-8")

          print("======================================")
          print("FINAL ANDROID GRADLE CONFIG")
          print("======================================")
          print(text)

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              raise Exception(
                  "Desugaring was NOT enabled!"
              )

          if "desugar_jdk_libs" not in text:
              raise Exception(
                  "desugar_jdk_libs dependency was NOT added!"
              )

          print("======================================")
          print("DESUGARING CONFIGURATION OK")
          print("======================================")

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Android configuration
        run: |
          echo "Checking desugaring..."
          grep -n "isCoreLibraryDesugaringEnabled" \
            android/app/build.gradle.kts

          grep -n "desugar_jdk_libs" \
            android/app/build.gradle.kts

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konj-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
