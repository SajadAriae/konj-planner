name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          mkdir /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          flutter create --project-name planner --org com.konj --platforms android .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/lib/main.dart lib/main.dart

      - name: Add Konj widget, icon and Android configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("android/app/src/main")
          pkg = root / "kotlin/com/konj/planner"
          res = root / "res"
          pkg.mkdir(parents=True, exist_ok=True)
          (res / "layout").mkdir(parents=True, exist_ok=True)
          (res / "xml").mkdir(parents=True, exist_ok=True)
          (res / "drawable").mkdir(parents=True, exist_ok=True)

          shutil.copy2("logo.png", res / "drawable/konj_logo.png")

          provider = """package com.konj.planner

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class KonjWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  appWidgetIds.forEach { widgetId ->
                      val tasks = widgetData.getInt("today_tasks", 0)
                      val done = widgetData.getInt("done_today", 0)
                      val goals = widgetData.getInt("goal_count", 0)
                      val avg = widgetData.getInt("goal_avg", 0)
                      val next = widgetData.getString("next_task", "برای امروز کاری نداری 🎉") ?: ""

                      val views = RemoteViews(context.packageName, R.layout.konj_widget).apply {
                          setTextViewText(R.id.widget_tasks, "کارهای امروز: $tasks")
                          setTextViewText(R.id.widget_done, "انجام‌شده: $done")
                          setTextViewText(R.id.widget_goals, "اهداف: $goals  •  میانگین پیشرفت: $avg٪")
                          setTextViewText(R.id.widget_next, next)
                      }

                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          """
          (pkg / "KonjWidgetProvider.kt").write_text(provider, encoding="utf-8")

          layout = """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/konj_widget_bg">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Konj Planner"
                  android:textStyle="bold"
                  android:textSize="18sp"
                  android:textColor="#202020" />

              <TextView
                  android:id="@+id/widget_tasks"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="7dp"
                  android:text="کارهای امروز: 0"
                  android:textSize="14sp"
                  android:textColor="#202020" />

              <TextView
                  android:id="@+id/widget_done"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="انجام‌شده: 0"
                  android:textSize="14sp"
                  android:textColor="#202020" />

              <TextView
                  android:id="@+id/widget_goals"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:text="اهداف: 0  •  میانگین پیشرفت: 0٪"
                  android:textSize="13sp"
                  android:textColor="#505050" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="کار بعدی"
                  android:textStyle="bold"
                  android:textSize="12sp"
                  android:textColor="#505050" />

              <TextView
                  android:id="@+id/widget_next"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:maxLines="2"
                  android:text="برای امروز کاری نداری 🎉"
                  android:textSize="14sp"
                  android:textColor="#202020" />
          </LinearLayout>
          """
          (res / "layout/konj_widget.xml").write_text(layout, encoding="utf-8")

          bg = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="#22000000"/>
          </shape>
          """
          (res / "drawable/konj_widget_bg.xml").write_text(bg, encoding="utf-8")

          info = """<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="120dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/konj_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          """
          (res / "xml/konj_widget_info.xml").write_text(info, encoding="utf-8")

          manifest = root / "AndroidManifest.xml"
          s = manifest.read_text(encoding="utf-8")
          s = s.replace('@mipmap/ic_launcher_round', '@drawable/konj_logo')
          s = s.replace('@mipmap/ic_launcher', '@drawable/konj_logo')
          s = s.replace('android:label="planner"', 'android:label="Konj Planner"')
          s = s.replace('android:label="@string/app_name"', 'android:label="Konj Planner"')

          permissions = """
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          """
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda x: x.group(1) + permissions, s, count=1)

          widget_receiver = """
          <receiver
              android:name=".KonjWidgetProvider"
              android:exported="true">
              <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
              </intent-filter>
              <meta-data
                  android:name="android.appwidget.provider"
                  android:resource="@xml/konj_widget_info" />
          </receiver>
          """
          if "KonjWidgetProvider" not in s:
              s = s.replace("</application>", widget_receiver + "</application>")

          notif_receiver = """
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
            <intent-filter>
              <action android:name="android.intent.action.BOOT_COMPLETED"/>
              <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
            </intent-filter>
          </receiver>
          """
          if "ScheduledNotificationReceiver" not in s:
              s = s.replace("</application>", notif_receiver + "</application>")

          manifest.write_text(s, encoding="utf-8")

          for f in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not f.exists():
                  continue
              g = f.read_text(encoding="utf-8")
              g = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", g)
              g = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 23", g)
              f.write_text(g, encoding="utf-8")
          PY

      - name: Configure notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
              if not f.exists():
                  continue
              kts = f.name.endswith('.kts')
              g = f.read_text()
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              if 'coreLibraryDesugaringEnabled' not in g and 'isCoreLibraryDesugaringEnabled' not in g:
                  g = g.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
              if 'desugar_jdk_libs' not in g:
                  g += '\ndependencies {\n    ' + dep + '\n}\n'
              f.write_text(g)
          PY

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: konj-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
