name: planner
description: Konj Planner - Offline personal planner
publish_to: none
version: 1.0.9+20

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  home_widget: ^0.10.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/repo.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo.png"
